<html>
<head> 

    <title>Cadastro de Alunos</title>
</head>

<body>

    <h2>Cadastro de Alunos</h2>

    <form action="#" method="POST">

        <p>
            <label for="nome">Nome do Aluno:</label><br>
            <input type="text" id="nome"
            name="nome"
            placeholder="Digite seu nome"
            required>
        </p>

        <p>
            <label for="email">E-mail do Aluno:</label><br>
            <input type="email" id="email"
            name="email"
            placeholder="seuemail@exemplo.com"
            required>
        </p>

        <p>
            <label for="senha">Senha de Acesso:</label><br>
            <input type="password" id="senha"
            name="senha"
            required>
        </p>

        <p>
            <label for="assunto">Assunto:</label><br>

            <select id="assunto" name="assunto">
                <option value="informatica">Informática</option>
                <option value="atividade">Atividade</option>
                <option value="duvida">Dúvida</option>
                <option value="matematica">Matemática</option>
            </select>
        </p>

        <p>
            <label for="mensagem">Comentário:</label><br>

            <textarea id="mensagem"
            name="mensagem"
            rows="4"
            cols="30"
            placeholder="Digite seu comentário..."></textarea>
        </p>

        <p>
            <button type="submit">Cadastrar</button>
            <button type="reset">Apagar</button>
        </p>

        <p>
            Preencha todos os campos para realizar seu cadastro.
        </p>

    </form>
<p>
    <label
    for="nascimento">Data de nascimento</label></br>
    <input type="date" id="nascimento"
    name="nascimento">
</p>
</body>
</html>
